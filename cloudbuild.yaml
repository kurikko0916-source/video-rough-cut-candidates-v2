steps:
  - name: gcr.io/cloud-builders/docker
    args: [build, --target, web, -t, asia-northeast1-docker.pkg.dev/$PROJECT_ID/video-rough-cut/web:$BUILD_ID, .]
  - name: gcr.io/cloud-builders/docker
    args: [push, asia-northeast1-docker.pkg.dev/$PROJECT_ID/video-rough-cut/web:$BUILD_ID]
  - name: gcr.io/cloud-builders/docker
    args: [build, --target, worker, -t, asia-northeast1-docker.pkg.dev/$PROJECT_ID/video-rough-cut/worker:$BUILD_ID, .]
  - name: gcr.io/cloud-builders/docker
    args: [push, asia-northeast1-docker.pkg.dev/$PROJECT_ID/video-rough-cut/worker:$BUILD_ID]
images:
  - asia-northeast1-docker.pkg.dev/$PROJECT_ID/video-rough-cut/web:$BUILD_ID
  - asia-northeast1-docker.pkg.dev/$PROJECT_ID/video-rough-cut/worker:$BUILD_ID
options:
  machineType: E2_HIGHCPU_8
timeout: 3600s
